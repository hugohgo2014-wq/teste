<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bixu Evolutivo 2.0</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05070d;color:#dde7f7;font:15px system-ui,sans-serif}
[hidden]{display:none!important}nav,.row{display:flex;flex-wrap:wrap;gap:4px}nav button{flex:1}.row button{flex:1 1 28%}
button,select{background:#1c2a44;color:#dde7f7;border:1px solid #2d4064;padding:9px 6px;border-radius:8px;font-size:14px}
button.on{background:#2f6fed;border-color:#8ab0ff}button:active{filter:brightness(1.2)}
canvas{width:100%;display:block;background:#101c30;touch-action:none;border-radius:8px}
section{padding:5px}label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px}
input[type=range]{flex:1;min-width:80px}input[type=color]{width:48px;height:32px;border:0;background:none}
details{margin:7px;background:#0e1626;border-radius:8px;padding:8px}p,#hud{margin:8px}
.small{font-size:12px;color:#9db0cc}.stats{background:#0e1626;border-radius:8px;padding:8px;margin:8px 0}
</style></head>
<body>
<nav><button id="t1" class="on">🧬 Editor</button><button id="t2">🪐 Planeta</button></nav>
<section id="s1">
<div class="row"><button id="l1" class="on">1 · Anatomia</button><button id="l2">2 · Aparência</button></div>
<canvas id="ed" width="400" height="320"></canvas>
<div id="tools" class="row">
<button data-t="skin" class="on">⚪ Pele</button><button data-t="mouth">🔴 Boca</button><button data-t="eye">👁 Olho</button>
<button data-t="leaf">🍃 Folha</button><button data-t="stom">🟣 Estômago</button><button data-t="del">🗑 Apagar</button>
<button data-t="bone">➖ Osso</button><button data-t="muscle">💪 Músculo</button><button data-t="tendon">🔗 Tendão</button>
</div>
<div id="look" hidden>
<label>Cor principal <input type="color" id="c1" value="#4fc3f7"></label>
<label>Cor secundária <input type="color" id="c2" value="#ffffff"></label>
<label>Padrão <select id="pat"><option value="0">Liso</option><option value="1">Pintas</option><option value="2">Listras</option></select></label>
<label>Pelos <input type="range" id="fur" min="0" max="8" value="0"></label>
</div>
<label>Cópias iniciais <input type="range" id="cop" min="1" max="20" value="5"><span id="copv">5</span></label>
<button id="go" style="width:100%;background:#1f8a4c">🚀 Soltar no planeta</button>
<button id="clr" style="width:100%">Limpar editor</button><p id="msg"></p>
<p class="small">Toque para colocar células. Escolha osso, músculo ou tendão e arraste de uma célula até outra para conectá-las.</p>
</section>
<section id="s2" hidden>
<canvas id="ar" width="800" height="800"></canvas>
<div class="row"><button id="mv" class="on">✋ Mover</button><button id="met">☄ Meteoro</button><button id="zi">＋ Zoom</button><button id="zo">－ Zoom</button><button id="home">🎯 Centralizar</button><button id="pause">⏸ Pausar</button></div>
<label>Velocidade <input id="spd" type="range" min="1" max="40" value="3"><span id="spv">3x</span></label>
<label>Tamanho do meteoro <input id="msz" type="range" min="5" max="80" value="20"></label>
<details open><summary>🌍 Condições do planeta</summary>
<label>Raio <input id="pr" type="range" min="300" max="1500" value="600"></label>
<label>Gravidade <input id="pg" type="range" min="0.05" max="1" step="0.01" value="0.35"></label>
<label>Comida <input id="pf" type="range" min="0" max="0.2" step="0.005" value="0.05"></label>
<label>Metabolismo <input id="pm" type="range" min="0.3" max="3" step="0.1" value="1"></label>
<label>Mutação <input id="pu" type="range" min="0" max="4" step="0.1" value="1"></label>
<label>Atmosfera (arrasto) <input id="pa" type="range" min="0.95" max="1" step="0.001" value="0.995"></label>
<button id="zero">♻ Zerar mundo</button></details>
<div id="hud" class="stats">Solte uma criatura do editor para começar.</div>
</section>
<script>
(async()=>{
const $=id=>document.getElementById(id);
let w;
try{
 const response=await fetch('sim.wasm');
 if(!response.ok)throw Error('HTTP '+response.status);
 const {instance}=await WebAssembly.instantiate(await response.arrayBuffer(),{});
 w=instance.exports;
}catch(e){
 document.body.insertAdjacentHTML('afterbegin','<p style="padding:12px;color:#ff9b9b">Não consegui carregar <b>sim.wasm</b>. Deixe-o na mesma pasta deste HTML e abra pelo servidor HTTP local. Detalhe: '+String(e.message)+'</p>');
 return;
}
w.init((Date.now()&0xffffff)||1);
const ORG=['#4fc3f7','#ff2e63','#fff','#3ddc5a','#c77dff'],SPR=['#cfd8dc','#ff5d5d','#ffd24a'],looks={};
const hue=s=>`hsl(${s*53%360},70%,58%)`,defLook=s=>({c1:hue(s),c2:'#fff',pat:0,fur:0});
function paint(c,N,S,L){
 if(!N.length)return;
 const cx=N.reduce((a,n)=>a+n.x,0)/N.length,cy=N.reduce((a,n)=>a+n.y,0)/N.length;
 if(L.fur)for(const n of N)if(n.t==0){const a0=Math.atan2(n.y-cy,n.x-cx);c.strokeStyle=L.c1;c.lineWidth=1.5;for(let k=0;k<L.fur;k++){const a=a0+(k-(L.fur-1)/2)*.45,l=8+L.fur;c.beginPath();c.moveTo(n.x,n.y);c.lineTo(n.x+Math.cos(a)*l,n.y+Math.sin(a)*l);c.stroke()}}
 for(const s of S){const a=N[s.a],b=N[s.b];if(!a||!b)continue;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.strokeStyle=SPR[s.t]||SPR[0];c.lineWidth=s.t==1?4+Math.abs(s.act||0)*5:s.t==2?2:3;c.stroke()}
 for(const n of N){c.beginPath();c.arc(n.x,n.y,n.t==2?8:7,0,Math.PI*2);c.fillStyle=ORG[n.t]||L.c1;c.fill();c.lineWidth=2;c.strokeStyle=L.c1;c.stroke();
 if(n.t==2){c.beginPath();c.arc(n.x,n.y,3,0,Math.PI*2);c.fillStyle='#000';c.fill()}
 if(n.t==0&&L.pat==1){c.beginPath();c.arc(n.x,n.y,3,0,Math.PI*2);c.fillStyle=L.c2;c.fill()}
 if(n.t==0&&L.pat==2){c.beginPath();c.arc(n.x,n.y,4.5,.5,2.6);c.strokeStyle=L.c2;c.lineWidth=2.5;c.stroke()}}
}
// Editor
const E={nodes:[],springs:[],from:null,cur:null},ec=$('ed'),ex=ec.getContext('2d');
const TOOLS={skin:{k:'n',t:0},mouth:{k:'n',t:1},eye:{k:'n',t:2},leaf:{k:'n',t:3},stom:{k:'n',t:4},bone:{k:'s',t:0},muscle:{k:'s',t:1},tendon:{k:'s',t:2},del:{k:'d'}};
let tool='skin',layer=1,species=0;
const curLook=()=>({c1:$('c1').value,c2:$('c2').value,pat:+$('pat').value,fur:+$('fur').value});
document.querySelectorAll('#tools button').forEach(b=>b.onclick=()=>{tool=b.dataset.t;document.querySelectorAll('#tools button').forEach(x=>x.classList.toggle('on',x===b))});
function setLayer(n){layer=n;$('l1').classList.toggle('on',n===1);$('l2').classList.toggle('on',n===2);$('tools').hidden=n===2;$('look').hidden=n===1;drawEd()}
$('l1').onclick=()=>setLayer(1);$('l2').onclick=()=>setLayer(2);
['c1','c2','pat','fur'].forEach(i=>$(i).oninput=drawEd);
$('cop').oninput=e=>$('copv').textContent=e.target.value;
const pos=ev=>{const r=ec.getBoundingClientRect();return{x:(ev.clientX-r.left)*400/r.width,y:(ev.clientY-r.top)*320/r.height}};
const hit=p=>E.nodes.findIndex(n=>Math.hypot(n.x-p.x,n.y-p.y)<18),snap=v=>Math.round(v/20)*20;
function delNode(i){E.springs=E.springs.filter(s=>s.a!==i&&s.b!==i);E.springs.forEach(s=>{if(s.a>i)s.a--;if(s.b>i)s.b--});E.nodes.splice(i,1)}
function connected(){const n=E.nodes.length;if(n<2||!E.springs.length)return false;const seen=new Set([0]),q=[0];while(q.length){const u=q.pop();for(const s of E.springs){const v=s.a===u?s.b:s.b===u?s.a:-1;if(v>=0&&!seen.has(v)){seen.add(v);q.push(v)}}}return seen.size===n}
function drawEd(){ex.fillStyle='#101c30';ex.fillRect(0,0,400,320);ex.fillStyle='#223';for(let x=0;x<=400;x+=20)for(let y=0;y<=320;y+=20)ex.fillRect(x-1,y-1,2,2);if(E.nodes.length)paint(ex,E.nodes,E.springs,curLook());if(E.from!==null&&E.cur){const a=E.nodes[E.from];if(a){ex.beginPath();ex.moveTo(a.x,a.y);ex.lineTo(E.cur.x,E.cur.y);ex.strokeStyle='#fff8';ex.lineWidth=2;ex.stroke()}}}
ec.onpointerdown=ev=>{if(layer!==1)return;ec.setPointerCapture(ev.pointerId);const p=pos(ev),i=hit(p),T=TOOLS[tool];
 if(T.k==='n'){if(i>=0)E.nodes[i].t=T.t;else if(E.nodes.length<12)E.nodes.push({x:snap(p.x),y:snap(p.y),t:T.t})}
 else if(T.k==='s'){E.from=i>=0?i:null;E.cur=p}
 else if(i>=0)delNode(i);
 else{const k=E.springs.findIndex(s=>{const a=E.nodes[s.a],b=E.nodes[s.b];return Math.hypot((a.x+b.x)/2-p.x,(a.y+b.y)/2-p.y)<20});if(k>=0)E.springs.splice(k,1)}
 drawEd()};
ec.onpointermove=ev=>{E.cur=pos(ev);if(E.from!==null)drawEd()};
ec.onpointerup=ev=>{const T=TOOLS[tool];if(layer===1&&T.k==='s'&&E.from!==null){const j=hit(pos(ev));if(j>=0&&j!==E.from){const o=E.springs.find(s=>(s.a===E.from&&s.b===j)||(s.a===j&&s.b===E.from));if(o)o.t=T.t;else if(E.springs.length<20)E.springs.push({a:E.from,b:j,t:T.t})}}E.from=null;drawEd()};
$('clr').onclick=()=>{E.nodes=[];E.springs=[];drawEd();$('msg').textContent='Editor limpo.'};
$('go').onclick=()=>{const m=$('msg');if(E.nodes.length<2||!E.springs.length)return m.textContent='Faça pelo menos 2 células e 1 ligação.';if(!connected())return m.textContent='O bicho precisa estar todo conectado.';if(species>=16)return m.textContent='Máximo de 16 espécies. Zere o mundo.';
 const cx=E.nodes.reduce((s,n)=>s+n.x,0)/E.nodes.length,cy=E.nodes.reduce((s,n)=>s+n.y,0)/E.nodes.length;
 E.nodes.forEach((n,i)=>w.design_node(i,n.x-cx,n.y-cy,n.t));E.springs.forEach((s,i)=>w.design_spring(i,s.a,s.b,s.t));
 looks[species]=curLook();const made=w.spawn_species(E.nodes.length,E.springs.length,+$('cop').value,species);
 if(made<=0)return m.textContent='Não foi possível criar as criaturas. Confira as ligações.';
 m.textContent=`Espécie ${species+1} solta (${made} criaturas).`;species++;show(2)};
// Planet
const ac=$('ar').getContext('2d'),arc=$('ar');let paused=false,speed=3,fr=0,mode='mv',zoom=1,cam={x:0,y:0},drag=null;
const sc=()=>zoom*800/(2.6*w.planet_r());
const setMode=m=>{mode=m;$('mv').classList.toggle('on',m==='mv');$('met').classList.toggle('on',m==='met')};
$('mv').onclick=()=>setMode('mv');$('met').onclick=()=>setMode('met');$('zi').onclick=()=>zoom=Math.min(zoom*1.5,12);$('zo').onclick=()=>zoom=Math.max(zoom/1.5,.3);
$('home').onclick=()=>{zoom=1;cam={x:0,y:0}};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶ Continuar':'⏸ Pausar'};
$('spd').oninput=e=>{speed=+e.target.value;$('spv').textContent=speed+'x'};
const applyPlanet=()=>w.set_planet(+$('pr').value,+$('pg').value,+$('pf').value,+$('pm').value,+$('pu').value,+$('pa').value);
['pr','pg','pf','pm','pu','pa'].forEach(i=>$(i).oninput=applyPlanet);applyPlanet();
$('zero').onclick=()=>{w.clear();species=0;$('msg').textContent='';$('hud').textContent='Mundo zerado. Crie uma criatura no editor.'};
function show(n){$('s1').hidden=n!==1;$('s2').hidden=n!==2;$('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2)}
$('t1').onclick=()=>show(1);$('t2').onclick=()=>show(2);
const toW=e=>{const r=arc.getBoundingClientRect(),sx=(e.clientX-r.left)*800/r.width,sy=(e.clientY-r.top)*800/r.height;return{x:(sx-400)/sc()+cam.x,y:(sy-400)/sc()+cam.y,sx,sy}};
arc.onpointerdown=e=>{arc.setPointerCapture(e.pointerId);drag={p:toW(e),cx:cam.x,cy:cam.y}};
arc.onpointermove=e=>{if(drag&&mode==='mv'){const q=toW(e);cam.x=drag.cx-(q.sx-drag.p.sx)/sc();cam.y=drag.cy-(q.sy-drag.p.sy)/sc()}};
arc.onpointerup=e=>{if(drag&&mode==='met'){const q=toW(e),p=drag.p;let vx=(q.x-p.x)*.03,vy=(q.y-p.y)*.03;if(Math.hypot(vx,vy)<.1){const d=Math.hypot(p.x,p.y)||1;vx=-p.x/d*2;vy=-p.y/d*2}w.meteor(p.x,p.y,vx,vy,+$('msz').value)}drag=null};
function draw(){
 const R=w.planet_r(),s=sc(),sa=w.sun_angle(),len=w.render(),f=new Float32Array(w.memory.buffer,w.render_ptr(),len);
 ac.setTransform(1,0,0,1,0,0);ac.fillStyle='#05070d';ac.fillRect(0,0,800,800);ac.setTransform(s,0,0,s,400-cam.x*s,400-cam.y*s);
 ac.beginPath();ac.arc(0,0,R+35,0,Math.PI*2);ac.fillStyle='#1b3a6a66';ac.fill();ac.beginPath();ac.arc(0,0,R,0,Math.PI*2);ac.fillStyle='#4a3626';ac.fill();
 ac.beginPath();ac.arc(0,0,R,sa-Math.PI/2,sa+Math.PI/2);ac.fillStyle='#ffe69638';ac.fill();
 ac.beginPath();ac.arc(Math.cos(sa)*R*2,Math.sin(sa)*R*2,R*.1,0,Math.PI*2);ac.fillStyle='#ffd84a';ac.fill();
 let k=0,nf=f[k++];ac.fillStyle='#7cfc00';for(let i=0;i<nf;i++){ac.beginPath();ac.arc(f[k],f[k+1],5,0,Math.PI*2);ac.fill();k+=2}
 const nc=f[k++];for(let c=0;c<nc;c++){const sid=f[k++],n=f[k++],m=f[k++],en=f[k++],N=[],S=[];for(let i=0;i<n;i++){N.push({x:f[k],y:f[k+1],t:f[k+2]});k+=3}for(let i=0;i<m;i++){S.push({a:f[k],b:f[k+1],t:f[k+2],act:f[k+3]});k+=4}paint(ac,N,S,looks[sid]||defLook(sid));const q=N[0];if(q){ac.fillStyle='#000a';ac.fillRect(q.x-15,q.y-24,30,4);ac.fillStyle=en>60?'#6f6':'#fa4';ac.fillRect(q.x-15,q.y-24,30*Math.min(en/150,1),4)}}
 const nm=f[k++];ac.fillStyle='#ff8a3d';for(let i=0;i<nm;i++){ac.beginPath();ac.arc(f[k],f[k+1],f[k+2],0,Math.PI*2);ac.fill();k+=3}
}
function hud(){let h='';for(let s=0;s<species;s++){const c=w.count_sid(s);h+=`<div><span style="color:${(looks[s]||defLook(s)).c1}">■</span> Espécie ${s+1}: ${c?c+' vivas · '+w.avg_nodes(s).toFixed(1)+' células em média':'💀 extinta'}</div>`}$('hud').innerHTML=h||'Solte uma criatura do editor para começar.'}
(function loop(){if(!$('s2').hidden){if(!paused)w.step_n(speed);draw();if(++fr%20===0)hud()}requestAnimationFrame(loop)})();
drawEd();
})();
</script></body></html>
